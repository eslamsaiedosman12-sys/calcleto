<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة السائق</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7488;--pr:#2f6fed;--pr2:#e8f0ff;--ok:#12a36b;--bad:#e5484d;--bd:#e3e8f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192031;--tx:#eef1f8;--mu:#9aa4bb;--pr:#5b8dff;--pr2:#202c4a;--ok:#34d399;--bad:#ff6b70;--bd:#2a344d}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192031;--tx:#eef1f8;--mu:#9aa4bb;--pr:#5b8dff;--pr2:#202c4a;--ok:#34d399;--bad:#ff6b70;--bd:#2a344d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:14px;text-align:center}
.nav button{background:var(--pr2);color:var(--pr);border:0;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
.full{grid-column:1/-1}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:var(--bad)}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd);gap:8px}
.it:first-of-type{border-top:0}
.it small{color:var(--mu);display:block}
.it .v{font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:6px}
.sum{background:linear-gradient(135deg,#2f6fed,#6a4cf0);color:#fff;border:0}
.sum .l{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;opacity:.95}
.sum .t{border-top:1px solid rgba(255,255,255,.35);margin-top:6px;padding-top:10px;font-size:20px;font-weight:800;opacity:1}
.sum input{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff;width:90px;padding:5px 8px;text-align:center}
.pd{width:100%;margin-top:10px;padding:10px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;background:#fff3d6;color:#8a5a00}
.pd.on{background:#d9f7e8;color:#0b7a4f}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.g2 label{color:#fff;opacity:.85}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.g3 label{color:#fff;opacity:.85}.g3 input{width:100%}
.un{cursor:pointer}.sec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.s{background:var(--pr2);color:var(--pr);margin-top:0}
.tag{font-size:11px;background:#ffe3e3;color:var(--bad);border-radius:8px;padding:1px 7px}
</style>
</head>
<body>
<div class="w">
  <h1>🚗 حاسبة السائق</h1>
  <div class="sub" id="today"></div>
  <div class="card"><div class="nav"><button onclick="mv(1)">›</button><b id="wk"></b><button onclick="mv(-1)">‹</button></div><button class="pd" id="pb" onclick="tp()"></button></div>
  <div class="card"><h2>🧾 الأسابيع اللي لسه متقبضتش</h2><div id="ul"></div></div>
  <div class="card sum">
    <div class="g2"><div><label>سعر الكيلو (ج.م)</label><input id="kr" type="number" min="0" inputmode="decimal" oninput="setS()"></div><div><label>سعر اليوم العادي (ج.م)</label><input id="dr" type="number" min="0" inputmode="decimal" oninput="setS()"></div></div>
    <div class="l"><span>إجمالي الكيلومترات</span><b id="sk">0</b></div>
    <div class="l"><span>عدد الأيام العادية</span><b id="sy">0</b></div>
    <div class="l"><span>أجر الكيلومترات</span><b id="skp">0</b></div>
    <div class="l"><span>أجر الأيام</span><b id="syp">0</b></div>
    <div class="l"><span>المستحق</span><b id="sg">0</b></div>
    <div class="l"><span>السلف</span><b id="sa">0</b></div>
    <div class="l t"><span>الصافي</span><span id="sn">0</span></div>
  </div>
  <div class="card"><div class="sec"><button class="btn s" onclick="cp(txt())">📋 نسخ ملخص الأسبوع</button><button class="btn s" onclick="cp(JSON.stringify(S))">💾 نسخة احتياطية</button><button class="btn s" onclick="rs()" style="grid-column:1/-1">♻️ استرجاع نسخة</button></div></div>
  <div class="card"><h2>🛣️ الكيلومترات</h2><div class="row"><div><label>التاريخ</label><input id="dk" type="date"></div><div><label>عدد الكيلومترات</label><input id="vk" type="number" min="0" inputmode="decimal"></div><div class="full"><label>ملاحظة (اختياري)</label><input id="nk" type="text"></div></div><button class="btn" onclick="add('k')">إضافة كيلومترات</button><div id="lk" style="margin-top:8px"></div></div>
  <div class="card"><h2>📅 الأيام العادية</h2><div class="row"><div><label>التاريخ</label><input id="dy" type="date"></div><div><label>عدد الأيام</label><input id="vy" type="number" min="0" inputmode="decimal"></div><div class="full"><label>ملاحظة (اختياري)</label><input id="ny" type="text"></div></div><button class="btn" onclick="add('y')">إضافة أيام</button><div id="ly" style="margin-top:8px"></div></div>
  <div class="card"><h2>💸 السلف</h2><div class="row"><div><label>التاريخ</label><input id="da" type="date"></div><div><label>المبلغ</label><input id="va" type="number" min="0" inputmode="decimal"></div><div class="full"><label>ملاحظة (اختياري)</label><input id="na" type="text"></div></div><button class="btn o" onclick="add('a')">إضافة سلفة</button><div id="la" style="margin-top:8px"></div></div>
  
</div>
<script>
var S={kr:0,dr:0,k:[],y:[],a:[],p:{}},ws=null;
try{var r=JSON.parse(localStorage.getItem('drv')||'null');if(r)S=Object.assign(S,r)}catch(x){}
var DB=null,tm2;function save(){try{localStorage.setItem('drv',JSON.stringify(S))}catch(x){}clearTimeout(tm2);tm2=setTimeout(function(){if(DB)DB.set({j:JSON.stringify(S)}).catch(function(){})},500)}
var $=function(i){return document.getElementById(i)};
var L='ar-EG-u-nu-latn',OR=['الأول','الثاني','الثالث','الرابع','الخامس'];
function ds(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
function pd(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function fd(s){return new Intl.DateTimeFormat(L,{weekday:'long',day:'numeric',month:'long'}).format(pd(s))}
function sow(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}
function n2(v){return new Intl.NumberFormat(L,{maximumFractionDigits:2}).format(v)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function mv(k){ws.setDate(ws.getDate()+7*k);render()}
function setS(){S.kr=+$('kr').value||0;S.dr=+$('dr').value||0;save();render(true)}
function add(t){var d=$('d'+t).value,v=+$('v'+t).value;if(!d||!v){alert('اكتب التاريخ والقيمة');return}
  S[t].push({id:Date.now(),d:d,m:v,n:$('n'+t).value});save();$('v'+t).value=t=='y'?'1':'';$('n'+t).value='';ws=sow(pd(d));render()}
function del(t,id){S[t]=S[t].filter(function(x){return x.id!==id});save();render()}
function wl(w){var m=new Date(w);m.setDate(m.getDate()+3);return 'الأسبوع '+OR[Math.floor((m.getDate()-1)/7)]+' من '+new Intl.DateTimeFormat(L,{month:'long'}).format(m)}
function rg(w){var e=new Date(w);e.setDate(e.getDate()+6);var f=new Intl.DateTimeFormat(L,{day:'numeric',month:'long'});return 'من '+f.format(w)+' إلى '+f.format(e)}
function sum(a){var t=0;a.forEach(function(x){t+=x.m});return t}
function calc(w){var a=ds(w),e=new Date(w);e.setDate(e.getDate()+6);var b=ds(e),f=function(x){return x.d>=a&&x.d<=b};
  var k=S.k.filter(f),y=S.y.filter(f),ad=S.a.filter(f),km=sum(k),dy=sum(y),kp=km*S.kr,yp=dy*S.dr,g=kp+yp,A=sum(ad);
  return{k:k,y:y,a:ad,km:km,dy:dy,kp:kp,yp:yp,g:g,A:A,net:g-A,has:k.length||y.length||ad.length}}
function tp(){var k=ds(ws);S.p[k]=!S.p[k];save();render()}
function go(k){ws=pd(k);render();window.scrollTo(0,0)}
function cp(t){try{navigator.clipboard.writeText(t).then(function(){alert('تم النسخ ✅')},function(){prompt('انسخ من هنا',t)})}catch(x){prompt('انسخ من هنا',t)}}
function rs(){var t=prompt('الصق النسخة الاحتياطية هنا');if(!t)return;try{var r=JSON.parse(t);if(!r.k||!r.a)throw 1;S=Object.assign({p:{}},r);save();render();alert('تم الاسترجاع ✅')}catch(x){alert('النسخة غير صالحة')}}
function txt(){var c=calc(ws);return wl(ws)+'\n'+rg(ws)+'\nالكيلومترات: '+n2(c.km)+' كم = '+n2(c.kp)+' ج.م\nالأيام: '+n2(c.dy)+' يوم = '+n2(c.yp)+' ج.م\nالمستحق: '+n2(c.g)+' ج.م\nالسلف: '+n2(c.A)+' ج.م\nالصافي: '+n2(c.net)+' ج.م\n'+(S.p[ds(ws)]?'✅ تم القبض':'⏳ لم يتم القبض')}
function LS(t,arr,u){arr=arr.slice().sort(function(x,y){return x.d<y.d?-1:1});return arr.length?arr.map(function(x){return '<div class="it"><div>'+fd(x.d)+(x.n?'<small>'+esc(x.n)+'</small>':'')+'</div><span class="v">'+n2(x.m)+' '+u+'</span><button class="x" onclick="del(\''+t+'\','+x.id+')">✕</button></div>'}).join(''):'<div class="empty">لا يوجد هذا الأسبوع</div>'}
function render(keep){
  var c=calc(ws),pk=!!S.p[ds(ws)];
  $('wk').innerHTML=wl(ws)+'<br><span style="font-weight:400;color:var(--mu);font-size:12px">'+rg(ws)+'</span>';
  var pb=$('pb');pb.className='pd'+(pk?' on':'');pb.textContent=pk?'✅ تم القبض (اضغط للتراجع)':'⏳ لم يتم القبض (اضغط عند القبض)';
  $('sk').textContent=n2(c.km)+' كم';$('sy').textContent=n2(c.dy)+' يوم';$('skp').textContent=n2(c.kp)+' ج.م';$('syp').textContent=n2(c.yp)+' ج.م';
  $('sg').textContent=n2(c.g)+' ج.م';$('sa').textContent=n2(c.A)+' ج.م';$('sn').textContent=n2(c.net)+' ج.م';
  $('lk').innerHTML=LS('k',c.k,'كم');$('ly').innerHTML=LS('y',c.y,'يوم');$('la').innerHTML=LS('a',c.a,'ج.م');
  var set={};S.k.concat(S.y,S.a).forEach(function(x){set[ds(sow(pd(x.d)))]=1});
  var ks=Object.keys(set).sort().reverse(),cnt=0,tot=0,h='';
  ks.forEach(function(k){var w=pd(k),q=calc(w);if(S.p[k]||!q.has)return;cnt++;tot+=q.net;
    h+='<div class="it un" onclick="go(\''+k+'\')"><div>'+wl(w)+'<small>'+rg(w)+'</small></div><span class="v">'+n2(q.net)+' ج.م</span></div>'});
  $('ul').innerHTML=cnt?'<div class="it" style="border:0;background:var(--pr2);border-radius:10px;padding:10px"><b>'+cnt+' أسبوع لم يُقبض</b><span class="v">'+n2(tot)+' ج.م</span></div>'+h:'<div class="empty">كل الأسابيع متقبضة 🎉</div>';
  if(!keep){$('kr').value=S.kr||'';$('dr').value=S.dr||''}}
var t=new Date();ws=sow(t);
$('today').textContent='اليوم: '+new Intl.DateTimeFormat(L,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(t);
['k','y','a'].forEach(function(i){$('d'+i).value=ds(t)});$('vy').value='1';render();
(async function(){try{if(!window.claude)return;var u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;var id=await u.id();
DB=d.collection('data/users/'+id).doc('state');var sn=await DB.get();
if(sn.exists){S=Object.assign({kr:0,dr:0,k:[],y:[],a:[],p:{}},JSON.parse(sn.data().j));try{localStorage.setItem('drv',JSON.stringify(S))}catch(x){}render()}
else if(S.k.length||S.y.length||S.a.length||S.kr||S.dr){DB.set({j:JSON.stringify(S)})}}catch(x){}})();
</script>
</body>
</html>
